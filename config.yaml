firm: topstep_150k_2026
billing_cycle_days: 21
profit_split: 0.90

combine_rules:
  profit_target: 9000.0
  trailing_mll: 4500.0
  consistency_cap_ratio: 0.50
  max_days: 1500            # safety cap; unfinished attempts are counted as failures

paths:
  standard:
    monthly_cost: 199.0
    activation_fee: 149.0
    reset_fee: 199.0
    intraday_dll: null
  no_activation:
    monthly_cost: 229.0
    activation_fee: 0.0
    reset_fee: 229.0
    intraday_dll: null
  no_activation_dll:
    monthly_cost: 199.0  # $229 base - $30 Responsible Trading Discount
    activation_fee: 0.0
    reset_fee: 199.0
    intraday_dll: -3000.0

friction:
  round_turn_commission: 2.50   # $ per round turn per mini (both engines)
  slippage_per_rt: 1.00         # $ per round turn, legacy synthetic engine only
  trades_per_day: 2             # legacy synthetic engine only
  slippage_ticks_rt: 1.0        # real-data engine: ticks lost per round turn (NQ tick = $5/mini)

# Rules verified against Topstep's own help-centre pages (web search, Oct 2026). These override the
# spec's older assumptions in the real-data engine; set the toggles back to reproduce the spec.
topstep_official:
  consistency_ratio: 0.55       # Combine: best day <= 55% of profit (spec said 0.50; sources conflict)
  combine_mll_locks: true       # MLL stops trailing at the starting balance (spec: trails forever)
  intraday_mll: true            # breach enforced in real time incl. open P&L (one Topstep page says EOD)
  win_day: 150.0                # winning day for the Standard payout path
  payout_min: 125.0
  cap_standard: 5000.0          # 150K; a limited-time offer lists 10000 / 12000 for accounts with a DLL
  cap_consistency: 6000.0
  consistency_xfa: 0.40
  consistency_days: 3
  standard_win_days: 5
  combine_micros: 150           # 15 minis
  max_combine_days: 252         # an unresolved Combine is abandoned after a year
  xfa_ladder: [[0, 3], [1500, 4], [2000, 5], [3000, 10], [4500, 15]]   # balance -> mini lots (third-party source)

market_process:
  eval_mode: no_edge  # Options: "no_edge" | "positive_drift"
  sharpe_annual: 0.0  # GROSS annualised Sharpe of the strategy (before friction)
  sigma_daily: 600.0

# XFA extraction model. The spec does not define payout mechanics, so these
# are explicit, configurable assumptions used to estimate mu_ext.
xfa:
  horizon_days: 252          # stop simulating the funded account after this many days
  payout_interval_days: 21   # request a payout every N trading days
  payout_fraction: 0.50      # fraction of net profit above buffer withdrawn per request
  payout_buffer: 0.0         # net profit kept in the account before withdrawals
  max_payout: 5000.0         # cap per payout request (gross, before split)

farm_policy:
  breach_action: cancel_and_reopen  # Options: "immediate_reset" | "cancel_and_reopen" | "wait_for_rebill"
  n_simulations: 10000
  max_concurrent_funded: 5
  seed: 42
