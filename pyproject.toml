[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topstep50k"
version = "0.1.0"
description = "Audit-first backtester for the TopStep $50K Combine"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "hmmlearn>=0.3",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "pyarrow>=15",
  "pydantic>=2.6",
  "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=4", "ruff>=0.4", "hypothesis>=6.100"]
data = ["databento>=0.85", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: marks tests that take >1s",
  "integration: end-to-end tests touching disk",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR0913"]
